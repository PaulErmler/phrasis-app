<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flexling</title>
  <style>
    /* Tokens mirrored from app/globals.css (:root / .dark) so this page
       matches the app's theme in both modes. */
    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --primary: oklch(0.7162 0.119 217.31);
      --primary-foreground: oklch(0.98 0.02 217.31);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --primary-foreground: oklch(0.28 0.07 217.31);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--background); color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      text-align: center;
    }
    .wrap { max-width: 320px; display: flex; flex-direction: column; align-items: center; }
    .logo { width: 88px; height: 88px; margin-bottom: 28px; }
    .logo svg { width: 100%; height: 100%; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.55; color: var(--muted-foreground); margin-bottom: 28px; }
    button {
      background: var(--primary); color: var(--primary-foreground);
      border: none; border-radius: 8px;
      font: inherit; font-size: 14px; font-weight: 500;
      height: 40px; padding: 0 32px; cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.75; }
    .spinner {
      width: 14px; height: 14px; margin-right: 8px;
      border: 2px solid var(--primary-foreground); border-top-color: transparent;
      border-radius: 50%; display: inline-block; vertical-align: -2px;
      animation: spin 0.8s linear infinite; visibility: hidden;
    }
    .retrying .spinner { visibility: visible; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

    <h1 data-i18n-title>You're offline</h1>
    <p data-i18n-body>Flexling needs an internet connection. We'll reconnect automatically as soon as you're back online.</p>
    <button id="retry" onclick="goBack()"><span class="spinner"></span><span data-i18n-button>Try again</span></button>
  </div>
  <script src="./app-url.js"></script>
  <script>
    // app-url.js is generated per environment by scripts/cap-sync.mjs;
    // production is the fallback if it's ever missing.
    var APP_URL = window.FLEXLING_APP_URL || 'https://flexling.com/app';

    if ((navigator.language || '').toLowerCase().indexOf('de') === 0) {
      document.querySelector('[data-i18n-title]').textContent = 'Du bist offline';
      document.querySelector('[data-i18n-body]').textContent =
        'Flexling braucht eine Internetverbindung. Sobald du wieder online bist, geht es automatisch weiter.';
      document.querySelector('[data-i18n-button]').textContent = 'Erneut versuchen';
    }

    function goBack() {
      document.getElementById('retry').classList.add('retrying');
      window.location.replace(APP_URL);
    }

    /**
     * This page can appear for transient reasons (a cancelled navigation,
     * a brief connection blip) — not only genuine offline. So it heals
     * itself: poll the server and return the moment it's reachable. The
     * sessionStorage guard stops a reload loop if the server responds but
     * the app page itself keeps failing.
     */
    var AUTO_KEY = 'flexling_offline_auto_retries';
    function autoReturn() {
      var tries = Number(sessionStorage.getItem(AUTO_KEY) || '0');
      if (tries >= 3) return; // give up on silent retries; manual button remains
      sessionStorage.setItem(AUTO_KEY, String(tries + 1));
      goBack();
    }
    function probe() {
      fetch(APP_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
        .then(autoReturn)
        .catch(function () {});
    }
    // Reset the guard after a while so a later, unrelated outage gets
    // fresh silent retries.
    setTimeout(function () { sessionStorage.removeItem(AUTO_KEY); }, 60000);
    window.addEventListener('online', probe);
    setInterval(probe, 3000);
    probe();
  </script>
